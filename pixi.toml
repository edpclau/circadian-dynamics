[workspace]
authors = ["Eddie Pérez <eddieperezclaudio@gmail.com>"]
channels = ["conda-forge"]
name = "circadian-dynamics"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
setup-cran = 'Rscript -e "if (!requireNamespace(\"lomb\", quietly=TRUE)) install.packages(\"lomb\", repos=\"https://cloud.r-project.org\")"'
test = 'Rscript -e "devtools::test()"'
check = 'Rscript -e "devtools::check(args=c(\"--no-manual\"), error_on=\"error\")"'
document = 'Rscript -e "devtools::document()"'

[dependencies]
r-base = ">=4.5.3,<4.6"
r-devtools = ">=2.5.0,<3"
r-testthat = ">=3.3.1,<4"
r-usethis = ">=3.2.1,<4"
r-roxygen2 = ">=8.0.0,<9"
r-gridextra = ">=2.3,<3"
r-pracma = ">=2.4.4,<3"
r-readr = ">=2.2.0,<3"
r-rstudioapi = ">=0.18.0,<0.19"
r-lubridate = ">=1.9.5,<2"
r-signal = ">=1.8_1,<2"
r-dplyr = ">=1.2.1,<2"
r-stringr = ">=1.6.0,<2"
r-magrittr = ">=2.0.5,<3"
r-tidyr = ">=1.3.2,<2"
r-broom = ">=1.0.13,<2"
r-ggplot2 = ">=4.0.3,<5"
r-rlang = ">=1.2.0,<2"
r-tibble = ">=3.3.1,<4"
r-forcats = ">=1.0.1,<2"
r-furrr = ">=0.4.0,<0.5"
r-lmtest = ">=0.9_40,<0.10"
r-future = ">=1.70.0,<2"
r-ggpp = ">=0.6.0,<0.7"
r-purrr = ">=1.2.2,<2"
r-knitr = ">=1.51,<2"
r-rmarkdown = ">=2.31,<3"
pandoc = ">=3.9.0.2,<4"
